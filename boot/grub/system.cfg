if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    # For BIOS mode
    insmod video_bochs
    insmod video_cirrus
    # For UEFI mode
    #insmod efi_gop
    #insmod efi_uga
    terminal_output gfxterm
fi
insmod png
background_image -m stretch /boot/grub/theme/grub.png
set timeout=10
set default=0
set theme=/boot/grub/theme/theme.cfg

### Universal Boot Entries (Available in both BIOS and UEFI) ###

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Local EFI Boot" {
        configfile /boot/grub/boot-local-efi.cfg
    }
fi

menuentry "Gdisk Relese Info"{
  echo " "
  echo "     .aMMMMP   dMMMMb    dMP   .dMMMb    dMP dMP "
  echo "    dMP'      dMP VMP   amr   dMP' VP   dMP dMP  "
  echo "   dMP MMP'  dMP dMP   dMP    VMMMb    dMMMM'    "  
  echo "  dMP.dMP   dMP.aMP   dMP   dP .dMP   dMP'AMF    " 
  echo "  VMMMP'   dMMMMP'   dMP    VMMMP'   dMP dMP     " 
  echo " "
  echo "  Gdisk v3.0 - Portalize Your Computing!"
  echo "  https://github.com/glitchlinux/gdisk.git"
  echo "  Gdisk version: 3.0 - Maintainer: Glitch Linux"
  echo "  DISCLAIMER: Gdisk comes with ABSOLUTELY NO WARRANTY!"
  echo " "
  sleep --verbose --interruptible 15
  echo ""
  echo ""
}

menuentry "Console Mode" {
    terminal_output console
    configfile /boot/grub/gdisk.cfg
}

menuentry "Shutdown" {
    halt
}

menuentry "Reboot" {
    reboot
}

menuentry "[←]" {
    configfile /boot/grub/gdisk.cfg
}
