# ╔═══════════════════════════════════════════════╗
# ║  Gdisk - VHD / VHDX Pre-Boot Menu             ║
# ║  BIOS: ntloader   UEFI: ntboot   + fallbacks  ║
# ╚═══════════════════════════════════════════════╝
#
# Variables expected (exported by caller):
#   gdisk_file  = "(hd0,gpt2)/Gdisk/file.vhd"
#   gdisk_path  = "/Gdisk/file.vhd"
#   gdisk_dev   = "hd0,gpt2"
#
# UEFI native  : ntboot --vhd  (bootmgfw.efi from wimboot.xz)
#                bootmgfw.efi has VHD/VHDX support built in
# BIOS  native : ntboot --vhd  (bootmgr.exe + bootvhd.dll + boot.sdi)
#                bootvhd.dll is the MS PCAT VHD attach driver
# Raw maps     : map / grub4dos / memdisk - FIXED VHD ONLY
#                (dynamic VHD and all VHDX have container headers
#                 that raw mapping cannot decode)
#
# NOTE: Windows native VHD boot requires the VHD to live on an NTFS
#       volume. FAT32 also caps files at 4 GiB. See README.

# ── Load required modules ──
insmod regexp
insmod loopback
insmod probe
insmod chain
insmod fat
insmod ntfs
insmod exfat
insmod xzio
insmod part_gpt
insmod part_msdos
insmod vhd
insmod map
insmod wimboot
insmod ntboot
insmod png

set theme=/boot/grub/theme/theme-vhd.cfg
set color_normal=white/black
set color_highlight=white/black

# ── Extract filename for display ──
regexp --set=gdisk_name '.*/([^/]+)$' "${gdisk_file}"
if [ -z "${gdisk_name}" ]; then
    set gdisk_name="${gdisk_path}"
fi

# ── Container type from extension ──
set gdisk_vtype="VHD"
if regexp '\.[vV][hH][dD][xX]$' "${gdisk_path}"; then
    set gdisk_vtype="VHDX"
fi

# ── Theme / Display ──
set timeout=-1
set default=0
set theme=/boot/grub/theme/theme-gdisk.cfg
set color_normal=white/black
set color_highlight=cyan/black

# ── Support file paths ──
set wb="/boot/grub/wimboot"

set has_bootmgfw=0
if [ -f ${wb}/wimboot.xz ]; then
    set has_bootmgfw=1
fi

set has_bootmgr=0
if [ -f ${wb}/bootmgr.exe ]; then
    set has_bootmgr=1
fi

# NT11-era bootmgr, version-matched to bootvhd.dll. The legacy
# bootmgr.exe (10.0.19041.1) cannot load the 10.0.22621 bootvhd.dll
# and fails with Windows Boot Manager status 0xc0000098.
set has_bootmgr_nt11=0
if [ -f ${wb}/bootmgr-nt11.exe ]; then
    set has_bootmgr_nt11=1
fi

set has_bootvhd=0
if [ -f ${wb}/bootvhd.dll ]; then
    set has_bootvhd=1
fi

set has_sdi=0
if [ -f ${wb}/boot.sdi ]; then
    set has_sdi=1
fi

# ── ntloader (grub4dos/ntloader v3.0.7) ──
# Self-contained NT6+ loader. initrd.cpio carries its own bootmgr.exe,
# bootvhd.dll and boot.sdi, so it needs nothing from ${wb}.
# This is the reliable BIOS path: a1ive's in-GRUB ntboot produces a BCD
# that BIOS bootmgr rejects with 0xc0000098 (no valid OS entry).
set nl="/boot/grub/ntloader"
set has_ntloader=0
if [ -f ${nl}/ntloader -a -f ${nl}/initrd.cpio ]; then
    set has_ntloader=1
fi

# ═══════════════════════════════════════
#  Host volume filesystem probe
# ═══════════════════════════════════════
probe --set=gdisk_hostfs -f "(${gdisk_dev})"
probe --set=gdisk_uuid -u "(${gdisk_dev})"
if [ -z "${gdisk_hostfs}" ]; then
    set gdisk_hostfs="unknown"
fi

set fs_ok_for_native=0
if [ "${gdisk_hostfs}" = "ntfs" ]; then
    set fs_ok_for_native=1
fi

# ═══════════════════════════════════════
#  Peek inside the container
#  (vhd.mod decodes VHD only, not VHDX)
# ═══════════════════════════════════════
set vhd_loop_ok=0
set has_win=0
set has_winpe=0
set gdisk_label="Virtual Hard Disk"

if [ "${gdisk_vtype}" = "VHD" ]; then
    if loopback vhdl "${gdisk_file}"; then
        set vhd_loop_ok=1
    fi
fi

if [ "${vhd_loop_ok}" = "1" ]; then
    for vp in 1 2 3 4 5; do
        if [ -d (vhdl,${vp})/Windows/System32 ]; then
            set has_win=1
        fi
        if [ -f (vhdl,${vp})/Windows/System32/winpeshl.exe ]; then
            set has_winpe=1
        fi
        if [ -d (vhdl,msdos${vp})/Windows/System32 ]; then
            set has_win=1
        fi
        if [ -f (vhdl,msdos${vp})/Windows/System32/winpeshl.exe ]; then
            set has_winpe=1
        fi
    done
    if [ "${has_winpe}" = "1" ]; then
        set gdisk_label="Windows PE (VHD)"
    elif [ "${has_win}" = "1" ]; then
        set gdisk_label="Windows NT6+ (VHD)"
    fi
    loopback -d vhdl
fi

if [ "${gdisk_vtype}" = "VHDX" ]; then
    set gdisk_label="Virtual Hard Disk v2 (VHDX)"
fi

# ═══════════════════════════════════════
#  Header
# ═══════════════════════════════════════
echo ""
echo "  Gdisk Pre-Boot: ${gdisk_name}"
echo "  Type: ${gdisk_label}"
echo "  Host volume: (${gdisk_dev}) fs=${gdisk_hostfs} uuid=${gdisk_uuid}"
if [ "${fs_ok_for_native}" = "0" ]; then
    echo "  WARNING: native VHD boot expects an NTFS host volume."
    echo "           On FAT32 files are also capped at 4 GiB."
fi
echo ""
# ═══════════════════════════════════════════════════════
#  BIOS
#    Primary : ntloader  (verified working, Win11 VHD)
#    Rest    : submenu
# ═══════════════════════════════════════════════════════

if [ "${grub_platform}" = "pc" ]; then

    # ── PRIMARY ──
    if [ "${has_ntloader}" = "1" ]; then
        menuentry "[ BIOS ] ${gdisk_vtype} Native Boot (ntloader)" "${gdisk_uuid}" "${gdisk_path}" {
            search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
            set enable_progress_indicator=1
            linux16 /boot/grub/ntloader/ntloader uuid=${2} vhd=${3}
            initrd16 /boot/grub/ntloader/initrd.cpio
            boot
        }
    elif [ "${has_bootmgr_nt11}" = "1" -a "${has_bootvhd}" = "1" ]; then
        menuentry "[ BIOS ] ${gdisk_vtype} Native Boot (ntboot)" "${gdisk_file}" {
            insmod ntboot
            set lang=en_US
            terminal_output console
            set enable_progress_indicator=1
            search --file --no-floppy --set=root /boot/grub/wimboot/bootvhd.dll
            ntboot --vhd --efi=/boot/grub/wimboot/bootmgr-nt11.exe \
                   --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
        }
    fi

    # ── EVERYTHING ELSE ──
    submenu "[ BIOS ] More ${gdisk_vtype} Boot Options  ->" {

        if [ "${has_ntloader}" = "1" ]; then
            menuentry "[BIOS] ${gdisk_vtype} ntloader - text mode errors" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                set enable_progress_indicator=1
                linux16 /boot/grub/ntloader/ntloader uuid=${2} vhd=${3} text f8 edit
                initrd16 /boot/grub/ntloader/initrd.cpio
                boot
            }

            menuentry "[BIOS] ${gdisk_vtype} ntloader - testsigning ON" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                set enable_progress_indicator=1
                linux16 /boot/grub/ntloader/ntloader uuid=${2} vhd=${3} testmode=yes text
                initrd16 /boot/grub/ntloader/initrd.cpio
                boot
            }

            menuentry "[BIOS] ${gdisk_vtype} ntloader - RAMDISK (ram=)" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                set enable_progress_indicator=1
                linux16 /boot/grub/ntloader/ntloader uuid=${2} ram=${3}
                initrd16 /boot/grub/ntloader/initrd.cpio
                boot
            }
        fi

        # ntboot: a1ive in-GRUB loader. Needs bootmgr.exe version-matched
        # to bootvhd.dll or BIOS bootmgr fails with 0xc0000098.
        if [ "${has_bootmgr_nt11}" = "1" -a "${has_bootvhd}" = "1" ]; then
            menuentry "[BIOS] ${gdisk_vtype} ntboot - native" "${gdisk_file}" {
                insmod ntboot
                set lang=en_US
                terminal_output console
                set enable_progress_indicator=1
                search --file --no-floppy --set=root /boot/grub/wimboot/bootvhd.dll
                ntboot --vhd --efi=/boot/grub/wimboot/bootmgr-nt11.exe \
                       --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
            }

            menuentry "[BIOS] ${gdisk_vtype} ntboot - WinPE mode" "${gdisk_file}" {
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/bootvhd.dll
                ntboot --vhd --winpe --efi=/boot/grub/wimboot/bootmgr-nt11.exe \
                       --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
            }

            menuentry "[BIOS] ${gdisk_vtype} ntboot - verbose / pause" "${gdisk_file}" {
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/bootvhd.dll
                ntboot --vhd --pause --gui --efi=/boot/grub/wimboot/bootmgr-nt11.exe \
                       --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
            }
        fi

        if [ "${has_bootmgr}" = "1" -a "${has_bootvhd}" = "1" ]; then
            menuentry "[BIOS] ${gdisk_vtype} ntboot - legacy bootmgr 19041" "${gdisk_file}" {
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/bootvhd.dll
                ntboot --vhd --pause --efi=/boot/grub/wimboot/bootmgr.exe \
                       --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
            }
        fi

        if [ "${has_bootmgfw}" = "1" -a "${has_bootvhd}" = "1" ]; then
            menuentry "[BIOS] ${gdisk_vtype} ntboot - bootmgfw fallback" "${gdisk_file}" {
                insmod xzio
                insmod loopback
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/wimboot.xz
                loopback wimboot /boot/grub/wimboot/wimboot.xz
                ntboot --vhd --pause --efi=(wimboot)/bootmgfw.efi \
                       --dll=/boot/grub/wimboot/bootvhd.dll "${2}"
            }
        fi

        # ── Raw mapping: FIXED VHD only ──
        if [ -f /boot/grub/images/grub.exe ]; then
            menuentry "[BIOS] Grub4dos Map - as hd0 (swap)" "${gdisk_path}" {
                linux16 /boot/grub/images/grub.exe "--config-file=\"map ${2} (hd0) || map --mem ${2} (hd0);map (hd0) (hd1);map --hook;rootnoverify (hd0);chainloader +1;boot\""
                boot
            }

            menuentry "[BIOS] Grub4dos Map - as last disk" "${gdisk_path}" {
                linux16 /boot/grub/images/grub.exe "--config-file=\"map ${2} (hd-1) || map --mem ${2} (hd-1);map --hook;rootnoverify (hd-1);chainloader +1;boot\""
                boot
            }

            menuentry "[BIOS] Grub4dos Console" {
                linux16 /boot/grub/images/grub.exe
                boot
            }
        fi

        menuentry "[BIOS] Memdisk Raw - Hard Disk (RAM)" "${gdisk_file}" {
            set enable_progress_indicator=1
            linux16 /boot/grub/images/memdisk harddisk raw
            initrd16 "${2}"
            boot
        }

        if [ -f /boot/grub/vdiskchain/vdisk.krn ]; then
            menuentry "[BIOS] VdiskChain Boot" "${gdisk_path}" {
                search --file --set=root /boot/grub/vdiskchain/vdisk.krn
                linux16 /boot/grub/vdiskchain/vdisk.krn vdisk=${2}
                initrd16 /boot/grub/vdiskchain/vdiskchain
                boot
            }
        fi

        if [ "${vhd_loop_ok}" = "1" ]; then
            menuentry "[BIOS] Browse inside ${gdisk_name}" "${gdisk_file}" {
                insmod vhd
                insmod loopback
                loopback vhdl "${2}"
                set gdisk_browse_dev="vhdl,1"
                set gdisk_browse_path=""
                export gdisk_browse_dev
                export gdisk_browse_path
                configfile /boot/grub/gdisk-browse.cfg
            }
        fi

        menuentry "[<-] Back" {
            configfile /boot/grub/vhd-preboot.cfg
        }
    }
fi

# ═══════════════════════════════════════════════════════
#  UEFI
#    Primary : ntboot  (verified working, Win11 VHD)
#    Rest    : submenu
# ═══════════════════════════════════════════════════════

if [ "${grub_platform}" = "efi" ]; then

    # ── PRIMARY ──
    if [ "${has_bootmgfw}" = "1" ]; then
        menuentry "[ UEFI ] ${gdisk_vtype} Native Boot (ntboot)" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            search --file --no-floppy --set=root /boot/grub/wimboot/wimboot.xz
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd --efi=(wimboot)/bootmgfw.efi "${2}"
        }
    elif [ "${has_ntloader}" = "1" ]; then
        menuentry "[ UEFI ] ${gdisk_vtype} Native Boot (ntloader)" "${gdisk_uuid}" "${gdisk_path}" {
            search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
            linux /boot/grub/ntloader/ntloader uuid=${2} vhd=${3}
            initrd /boot/grub/ntloader/initrd.cpio
            boot
        }
    fi

    # ── EVERYTHING ELSE ──
    submenu "[ UEFI ] More ${gdisk_vtype} Boot Options  ->" {

        if [ "${has_bootmgfw}" = "1" ]; then
            menuentry "[UEFI] ${gdisk_vtype} ntboot - WinPE mode" "${gdisk_file}" {
                insmod xzio
                insmod loopback
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/wimboot.xz
                loopback wimboot /boot/grub/wimboot/wimboot.xz
                ntboot --vhd --winpe --efi=(wimboot)/bootmgfw.efi "${2}"
            }

            menuentry "[UEFI] ${gdisk_vtype} ntboot - testsigning ON" "${gdisk_file}" {
                insmod xzio
                insmod loopback
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/wimboot.xz
                loopback wimboot /boot/grub/wimboot/wimboot.xz
                ntboot --vhd --testmode=yes --efi=(wimboot)/bootmgfw.efi "${2}"
            }

            menuentry "[UEFI] ${gdisk_vtype} ntboot - verbose / pause" "${gdisk_file}" {
                insmod xzio
                insmod loopback
                insmod ntboot
                set lang=en_US
                terminal_output console
                search --file --no-floppy --set=root /boot/grub/wimboot/wimboot.xz
                loopback wimboot /boot/grub/wimboot/wimboot.xz
                ntboot --vhd --pause --gui --efi=(wimboot)/bootmgfw.efi "${2}"
            }
        fi

        if [ "${has_ntloader}" = "1" ]; then
            menuentry "[UEFI] ${gdisk_vtype} ntloader - native" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                linux /boot/grub/ntloader/ntloader uuid=${2} vhd=${3}
                initrd /boot/grub/ntloader/initrd.cpio
                boot
            }

            menuentry "[UEFI] ${gdisk_vtype} ntloader - text mode" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                linux /boot/grub/ntloader/ntloader uuid=${2} vhd=${3} text f8 edit
                initrd /boot/grub/ntloader/initrd.cpio
                boot
            }

            menuentry "[UEFI] ${gdisk_vtype} ntloader - RAMDISK (ram=)" "${gdisk_uuid}" "${gdisk_path}" {
                search --file --no-floppy --set=root /boot/grub/ntloader/ntloader
                linux /boot/grub/ntloader/ntloader uuid=${2} ram=${3}
                initrd /boot/grub/ntloader/initrd.cpio
                boot
            }
        fi

        # ── Raw mapping: FIXED VHD only ──
        menuentry "[UEFI] Raw Disk Map - map --type=HD" "${gdisk_file}" {
            insmod map
            map --type=HD "${2}"
        }

        menuentry "[UEFI] Raw Disk Map - map -f (Forced)" "${gdisk_file}" {
            insmod map
            map -f "${2}"
        }

        if [ -f /boot/grub/vdiskchain/vdiskchain ]; then
            menuentry "[UEFI] VdiskChain Boot" "${gdisk_path}" {
                insmod chain
                chainloader /boot/grub/vdiskchain/vdiskchain vdisk=${2}
                boot
            }
        fi

        if [ "${vhd_loop_ok}" = "1" ]; then
            menuentry "[UEFI] Browse inside ${gdisk_name}" "${gdisk_file}" {
                insmod vhd
                insmod loopback
                loopback vhdl "${2}"
                set gdisk_browse_dev="vhdl,1"
                set gdisk_browse_path=""
                export gdisk_browse_dev
                export gdisk_browse_path
                configfile /boot/grub/gdisk-browse.cfg
            }
        fi

        menuentry "[<-] Back" {
            configfile /boot/grub/vhd-preboot.cfg
        }
    }
fi

# ── Back ──
menuentry "[<-] Back" {
    configfile /boot/grub/gdisk-boot.cfg
}
