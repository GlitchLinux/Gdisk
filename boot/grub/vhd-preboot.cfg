# ╔═══════════════════════════════════════════════╗
# ║  Gdisk - VHD / VHDX Pre-Boot Menu             ║
# ║  Native NT6+ boot via ntboot, plus raw maps    ║
# ╚═══════════════════════════════════════════════╝
#
# Variables expected (exported by caller):
#   gdisk_file  = "(hd0,gpt2)/Gdisk/file.vhd"
#   gdisk_path  = "/Gdisk/file.vhd"
#   gdisk_dev   = "hd0,gpt2"
#
# UEFI native  : ntboot --vhd  (bootmgfw.efi from wimboot.xz)
#                bootmgfw.efi has VHD/VHDX support built in
# BIOS  native : ntboot --vhd  (bootmgr.exe + bootvhd.dll + boot.sdi)
#                bootvhd.dll is the MS PCAT VHD attach driver
# Raw maps     : map / grub4dos / memdisk - FIXED VHD ONLY
#                (dynamic VHD and all VHDX have container headers
#                 that raw mapping cannot decode)
#
# NOTE: Windows native VHD boot requires the VHD to live on an NTFS
#       volume. FAT32 also caps files at 4 GiB. See README.

# ── Load required modules ──
insmod regexp
insmod loopback
insmod probe
insmod chain
insmod fat
insmod ntfs
insmod exfat
insmod xzio
insmod part_gpt
insmod part_msdos
insmod vhd
insmod map
insmod wimboot
insmod ntboot

# ── Extract filename for display ──
regexp --set=gdisk_name '.*/([^/]+)$' "${gdisk_file}"
if [ -z "${gdisk_name}" ]; then
    set gdisk_name="${gdisk_path}"
fi

# ── Container type from extension ──
set gdisk_vtype="VHD"
if regexp '\.[vV][hH][dD][xX]$' "${gdisk_path}"; then
    set gdisk_vtype="VHDX"
fi

# ── Theme / Display ──
set timeout=-1
set default=0
set theme=/boot/grub/theme/theme-gdisk.cfg
set color_normal=white/black
set color_highlight=cyan/black

# ── Support file paths ──
set wb="/boot/grub/wimboot"

set has_bootmgfw=0
if [ -f ${wb}/wimboot.xz ]; then
    set has_bootmgfw=1
fi

set has_bootmgr=0
if [ -f ${wb}/bootmgr.exe ]; then
    set has_bootmgr=1
fi

set has_bootvhd=0
if [ -f ${wb}/bootvhd.dll ]; then
    set has_bootvhd=1
fi

set has_sdi=0
if [ -f ${wb}/boot.sdi ]; then
    set has_sdi=1
fi

# ═══════════════════════════════════════
#  Host volume filesystem probe
# ═══════════════════════════════════════
probe --set=gdisk_hostfs -f "(${gdisk_dev})"
if [ -z "${gdisk_hostfs}" ]; then
    set gdisk_hostfs="unknown"
fi

set fs_ok_for_native=0
if [ "${gdisk_hostfs}" = "ntfs" ]; then
    set fs_ok_for_native=1
fi

# ═══════════════════════════════════════
#  Peek inside the container
#  (vhd.mod decodes VHD only, not VHDX)
# ═══════════════════════════════════════
set vhd_loop_ok=0
set has_win=0
set has_winpe=0
set gdisk_label="Virtual Hard Disk"

if [ "${gdisk_vtype}" = "VHD" ]; then
    if loopback vhdl "${gdisk_file}"; then
        set vhd_loop_ok=1
    fi
fi

if [ "${vhd_loop_ok}" = "1" ]; then
    for vp in 1 2 3 4 5; do
        if [ -d (vhdl,${vp})/Windows/System32 ]; then
            set has_win=1
        fi
        if [ -f (vhdl,${vp})/Windows/System32/winpeshl.exe ]; then
            set has_winpe=1
        fi
        if [ -d (vhdl,msdos${vp})/Windows/System32 ]; then
            set has_win=1
        fi
        if [ -f (vhdl,msdos${vp})/Windows/System32/winpeshl.exe ]; then
            set has_winpe=1
        fi
    done
    if [ "${has_winpe}" = "1" ]; then
        set gdisk_label="Windows PE (VHD)"
    elif [ "${has_win}" = "1" ]; then
        set gdisk_label="Windows NT6+ (VHD)"
    fi
    loopback -d vhdl
fi

if [ "${gdisk_vtype}" = "VHDX" ]; then
    set gdisk_label="Virtual Hard Disk v2 (VHDX)"
fi

# ═══════════════════════════════════════
#  Header
# ═══════════════════════════════════════
echo ""
echo "  Gdisk Pre-Boot: ${gdisk_name}"
echo "  Type: ${gdisk_label}"
echo "  Host volume: (${gdisk_dev}) fs=${gdisk_hostfs}"
if [ "${fs_ok_for_native}" = "0" ]; then
    echo "  WARNING: native VHD boot expects an NTFS host volume."
    echo "           On FAT32 files are also capped at 4 GiB."
fi
echo ""

# ═══════════════════════════════════════
#  UEFI - native NT6+ boot via ntboot
# ═══════════════════════════════════════

if [ "${grub_platform}" = "efi" ]; then

    if [ "${has_bootmgfw}" = "1" ]; then
        menuentry "[UEFI] ${gdisk_vtype} Native Boot (ntboot)" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd --efi=(wimboot)/bootmgfw.efi "${2}"
        }

        menuentry "[UEFI] ${gdisk_vtype} Native Boot - WinPE mode" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd --winpe --efi=(wimboot)/bootmgfw.efi "${2}"
        }

        menuentry "[UEFI] ${gdisk_vtype} Native Boot - testsigning ON" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd --testmode=yes --efi=(wimboot)/bootmgfw.efi "${2}"
        }

        menuentry "[UEFI] ${gdisk_vtype} Native Boot - verbose / pause" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd --pause --gui --efi=(wimboot)/bootmgfw.efi "${2}"
        }
    fi

    # ── Raw disk mapping (FIXED VHD only) ──
    menuentry "[UEFI] Raw Disk Map - map --type=HD" "${gdisk_file}" {
        insmod map
        map --type=HD "${2}"
    }

    menuentry "[UEFI] Raw Disk Map - map -f (Forced)" "${gdisk_file}" {
        insmod map
        map -f "${2}"
    }
fi

# ═══════════════════════════════════════
#  BIOS - native NT6+ boot via ntboot
# ═══════════════════════════════════════

if [ "${grub_platform}" = "pc" ]; then

    if [ "${has_bootmgr}" = "1" -a "${has_bootvhd}" = "1" ]; then
        menuentry "[BIOS] ${gdisk_vtype} Native Boot (ntboot)" "${gdisk_file}" {
            insmod ntboot
            set lang=en_US
            terminal_output console
            set enable_progress_indicator=1
            ntboot --vhd \
                   --efi=/boot/grub/wimboot/bootmgr.exe \
                   --dll=/boot/grub/wimboot/bootvhd.dll \
                   --sdi=/boot/grub/wimboot/boot.sdi \
                   "${2}"
        }

        menuentry "[BIOS] ${gdisk_vtype} Native Boot - no sdi override" "${gdisk_file}" {
            insmod ntboot
            set lang=en_US
            terminal_output console
            set enable_progress_indicator=1
            ntboot --vhd \
                   --efi=/boot/grub/wimboot/bootmgr.exe \
                   --dll=/boot/grub/wimboot/bootvhd.dll \
                   "${2}"
        }

        menuentry "[BIOS] ${gdisk_vtype} Native Boot - verbose / pause" "${gdisk_file}" {
            insmod ntboot
            set lang=en_US
            terminal_output console
            ntboot --vhd --pause \
                   --efi=/boot/grub/wimboot/bootmgr.exe \
                   --dll=/boot/grub/wimboot/bootvhd.dll \
                   --sdi=/boot/grub/wimboot/boot.sdi \
                   "${2}"
        }
    fi

    if [ "${has_bootmgfw}" = "1" -a "${has_bootvhd}" = "1" ]; then
        menuentry "[BIOS] ${gdisk_vtype} Native Boot - bootmgfw fallback" "${gdisk_file}" {
            insmod xzio
            insmod loopback
            insmod ntboot
            set lang=en_US
            terminal_output console
            loopback wimboot /boot/grub/wimboot/wimboot.xz
            ntboot --vhd \
                   --efi=(wimboot)/bootmgfw.efi \
                   --dll=/boot/grub/wimboot/bootvhd.dll \
                   "${2}"
        }
    fi

    # ── Grub4dos raw mapping (FIXED VHD only) ──
    if [ -f /boot/grub/images/grub.exe ]; then
        menuentry "[BIOS] Grub4dos Map - as hd0 (swap)" "${gdisk_path}" {
            linux16 /boot/grub/images/grub.exe "--config-file=\"map ${2} (hd0) || map --mem ${2} (hd0);map (hd0) (hd1);map --hook;rootnoverify (hd0);chainloader +1;boot\""
            boot
        }

        menuentry "[BIOS] Grub4dos Map - as last disk" "${gdisk_path}" {
            linux16 /boot/grub/images/grub.exe "--config-file=\"map ${2} (hd-1) || map --mem ${2} (hd-1);map --hook;rootnoverify (hd-1);chainloader +1;boot\""
            boot
        }

        menuentry "[BIOS] Grub4dos Console" {
            linux16 /boot/grub/images/grub.exe
            boot
        }
    fi

    # ── Memdisk raw (FIXED VHD only, loads fully into RAM) ──
    menuentry "[BIOS] Memdisk Raw - Hard Disk (RAM)" "${gdisk_file}" {
        set enable_progress_indicator=1
        linux16 /boot/grub/images/memdisk harddisk raw
        initrd16 "${2}"
        boot
    }
fi

# ═══════════════════════════════════════
#  VdiskChain (raw block IO, FIXED VHD only)
# ═══════════════════════════════════════
if [ -f /boot/grub/vdiskchain/vdiskchain ]; then
    if [ "${grub_platform}" = "efi" ]; then
        menuentry "[UEFI] VdiskChain Boot" "${gdisk_path}" {
            insmod chain
            chainloader /boot/grub/vdiskchain/vdiskchain vdisk=${2}
            boot
        }
    fi
    if [ "${grub_platform}" = "pc" ]; then
        menuentry "[BIOS] VdiskChain Boot" "${gdisk_path}" {
            search --file --set=root /boot/grub/vdiskchain/vdisk.krn
            linux16 /boot/grub/vdiskchain/vdisk.krn vdisk=${2}
            initrd16 /boot/grub/vdiskchain/vdiskchain
            boot
        }
    fi
fi

# ═══════════════════════════════════════
#  Inspect contents (VHD only)
# ═══════════════════════════════════════
if [ "${vhd_loop_ok}" = "1" ]; then
    menuentry "[..] Browse inside ${gdisk_name}" "${gdisk_file}" {
        insmod vhd
        insmod loopback
        loopback vhdl "${2}"
        set gdisk_browse_dev="vhdl,1"
        set gdisk_browse_path=""
        export gdisk_browse_dev
        export gdisk_browse_path
        configfile /boot/grub/gdisk-browse.cfg
    }
fi

# ── Back ──
menuentry "[<-] Back" {
    configfile /boot/grub/gdisk-boot.cfg
}
