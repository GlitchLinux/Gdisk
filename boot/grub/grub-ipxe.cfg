if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    insmod video_bochs
    insmod video_cirrus
    terminal_output gfxterm
fi

insmod png

background_image /boot/grub/theme/.ipxe.png

set theme=/boot/grub/theme/theme-ipxe.cfg
set timeout=10
set default=0

# Detect boot mode
if [ "${grub_platform}" == "efi" ]; then
    set boot_mode="UEFI"
else
    set boot_mode="BIOS"
fi

if [ "${grub_platform}" == "efi" ]; then
menuentry "Glitch iPXE Multi-Net-Boot - [UEFI]" {
    insmod part_msdos
    insmod fat
    chainloader /EFI/iPXE/Glitch-iPXE.efi
}
menuentry "Glitch iPXE Multi-Net-Boot LAN - [UEFI]" {
    insmod part_msdos
    insmod fat
    chainloader /EFI/iPXE/Glitch-LAN-iPXE.efi
}
else
    menuentry "Glitch iPXE Multi-Net-Boot - [BIOS]" {
        insmod part_msdos
        insmod fat
        linux16 /boot/grub/images/memdisk iso
        initrd16 /boot/grub/images/Glitch-iPXE.iso
    }
    menuentry "Glitch iPXE Multi-Net-Boot LAN - [BIOS]" {
        insmod part_msdos
        insmod fat
        linux16 /boot/grub/images/memdisk iso
        initrd16 /boot/grub/images/Glitch-LAN-iPXE.iso
    }
fi

menuentry "[←]" {
    configfile /boot/grub/gdisk.cfg
}
