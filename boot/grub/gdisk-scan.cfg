# ╔══════════════════════════════════════════════════════╗
# ║  Gdisk - .gdisk Virtual Disk Scanner                ║
# ║  Auto-scans all partitions for .gdisk disk images   ║
# ║  and routes each to gdisk-preboot.cfg               ║
# ║                                                      ║
# ║  Scans partition root and one directory level deep   ║
# ╚══════════════════════════════════════════════════════╝

insmod regexp
insmod probe
insmod part_gpt
insmod part_msdos

# ── Theme / Display ──────────────────────────────────────────
if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
fi
insmod png
if [ -f /boot/grub/theme/grub.png ]; then
    background_image -m stretch /boot/grub/theme/grub.png
fi

set theme=/boot/grub/theme/theme-gdisk.cfg
set timeout=-1
set default=0
set color_normal=white/black
set color_highlight=cyan/black

set gdisk_img_found=0

# ── Scan up to 8 disks, up to 8 partitions each ─────────────
for disk in 0 1 2 3 4 5 6 7; do
    for partnum in 1 2 3 4 5 6 7 8; do
        for partscheme in gpt msdos; do
            set trypart="(hd${disk},${partscheme}${partnum})"

            if [ -d "${trypart}/" ]; then

                # ── Scan root of partition ────────────────
                for gf in ${trypart}/*.gdisk ${trypart}/*.GDISK; do
                    if [ -f "${gf}" ]; then
                        regexp --set=1:gf_relpath '^\([^)]+\)(.+)$' "${gf}"
                        regexp --set=1:gf_basename '/([^/]+)$' "${gf_relpath}"

                        set gdisk_img_found=1

                        menuentry "[GDISK] ${gf_basename}  [${trypart}]" "${gf_relpath}" "hd${disk},${partscheme}${partnum}" {
                            set gdisk_path="${2}"
                            set gdisk_dev="${3}"
                            set gdisk_file="(${gdisk_dev})${gdisk_path}"
                            export gdisk_dev
                            export gdisk_path
                            export gdisk_file
                            configfile /boot/grub/gdisk-preboot.cfg
                        }
                    fi
                done

                # ── Scan one directory deep ───────────────
                for subdir in ${trypart}/*/; do
                    if [ -d "${subdir}" ]; then
                        for gf in ${subdir}*.gdisk ${subdir}*.GDISK; do
                            if [ -f "${gf}" ]; then
                                regexp --set=1:gf_relpath '^\([^)]+\)(.+)$' "${gf}"
                                regexp --set=1:gf_basename '/([^/]+)$' "${gf_relpath}"

                                set gdisk_img_found=1

                                menuentry "[GDISK] ${gf_basename}  [${trypart}]" "${gf_relpath}" "hd${disk},${partscheme}${partnum}" {
                                    set gdisk_path="${2}"
                                    set gdisk_dev="${3}"
                                    set gdisk_file="(${gdisk_dev})${gdisk_path}"
                                    export gdisk_dev
                                    export gdisk_path
                                    export gdisk_file
                                    configfile /boot/grub/gdisk-preboot.cfg
                                }
                            fi
                        done
                    fi
                done

            fi
        done
    done
done

# ── No results message ───────────────────────────────────────
if [ "${gdisk_img_found}" = "0" ]; then
    menuentry "No .gdisk files found" {
        echo ""
        echo "  Place .gdisk raw disk image files on any partition."
        echo "  Scans root and one subdirectory level deep."
        echo ""
        echo "  To create a .gdisk file:"
        echo "    qemu-img create -f raw mylinux.gdisk 20G"
        echo "    # Install Linux into it via QEMU"
        echo "    # Then run gdiskboot.sh inside the guest"
        echo ""
        echo "  Press any key to return..."
        read
        configfile /boot/grub/gdisk-scan.cfg
    }
fi

# ── Navigation ────────────────────────────────────────────────
menuentry "[<-] Back to Main Menu" {
    configfile /boot/grub/gdisk.cfg
}