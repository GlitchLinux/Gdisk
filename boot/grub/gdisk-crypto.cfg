# ╔══════════════════════════════════════════════════╗
# ║ gdisk-crypto.cfg - unlock a LUKS volume by UUID,   ║
# ║ then list its files in the native Gdisk browser    ║
# ╚══════════════════════════════════════════════════╝
# The UUID below is written per-device by:
#   /boot/Gdisk-Installer/encrypted-partition-setup.sh
# Ships with a placeholder zero-UUID that matches nothing until you run
# that script. Container must be LUKS1, or LUKS2 made with --pbkdf pbkdf2
# (GRUB here has no argon2 module, so default argon2id LUKS2 will NOT open).

insmod part_msdos
insmod part_gpt
insmod cryptodisk
insmod luks
insmod gcry_rijndael
insmod gcry_sha256
insmod gcry_sha512
insmod pbkdf2
insmod afsplitter
insmod fat
insmod iso9660
insmod loopback
insmod regexp
insmod probe

# >>> managed by encrypted-partition-setup.sh - do not edit these two lines <<<
set crypto_uuid="00000000-0000-0000-0000-000000000000"
set crypto_uuid_nd="00000000000000000000000000000000"
# <<< end managed >>>

# cryptomount -u scans every disk for a LUKS header with this UUID. GRUB builds
# differ on whether the stored UUID keeps its dashes, so we try the dashed form
# then the stripped form; the non-matching one fails instantly with no prompt.
set unlocked=0
if cryptomount -u "${crypto_uuid}"; then
    set unlocked=1
fi
if [ "${unlocked}" = "0" ]; then
    if cryptomount -u "${crypto_uuid_nd}"; then
        set unlocked=1
    fi
fi

if [ "${unlocked}" = "1" ]; then
    # Hand the decrypted volume (crypto0) to Gdisk's own file browser.
    set gdisk_browse_dev="crypto0"
    set gdisk_browse_path=""
    export gdisk_browse_dev
    export gdisk_browse_path
    configfile /boot/grub/gdisk-browse.cfg
else
    echo ""
    echo "  No encrypted volume unlocked (wrong passphrase, or none set up yet)."
    echo "  To set one up, boot Linux and run:"
    echo "    /boot/Gdisk-Installer/encrypted-partition-setup.sh"
    echo ""
    echo "  Press any key to return to the Gdisk menu..."
    read _dummy
    configfile /boot/grub/gdisk-boot.cfg
fi
