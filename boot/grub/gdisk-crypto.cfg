# ╔══════════════════════════════════════════════════╗
# ║ gdisk-crypto.cfg - unlock a LUKS volume by UUID,   ║
# ║ then list its files in the native Gdisk browser    ║
# ╚══════════════════════════════════════════════════╝
# The UUID below is written per-device by:
#   /boot/Gdisk-Installer/encrypted-partition-setup.sh
# It is the LUKS UUID with dashes STRIPPED - this GRUB build matches that
# form. Ships with a placeholder that matches nothing until you run that
# script. Container must be LUKS1, or LUKS2 made with --pbkdf pbkdf2
# (GRUB here has no argon2 module, so default argon2id LUKS2 will NOT open).

insmod part_msdos
insmod part_gpt
insmod cryptodisk
insmod luks
insmod gcry_rijndael
insmod gcry_sha256
insmod gcry_sha512
insmod pbkdf2
insmod afsplitter
insmod fat
insmod iso9660
insmod loopback
insmod regexp
insmod probe

# >>> managed by encrypted-partition-setup.sh - do not edit this line <<<
set crypto_uuid="00000000000000000000000000000000"
# <<< end managed >>>

# cryptomount -u scans every disk for a LUKS header with this UUID, so the
# encrypted volume is found wherever it sits (no fixed hd/partition number).
if cryptomount -u "${crypto_uuid}"; then
    # Hand the decrypted volume (crypto0) to Gdisk's own file browser.
    set gdisk_browse_dev="crypto0"
    set gdisk_browse_path=""
    export gdisk_browse_dev
    export gdisk_browse_path
    configfile /boot/grub/gdisk-browse.cfg
else
    echo ""
    echo "  No encrypted volume unlocked (wrong passphrase, or none set up yet)."
    echo "  To set one up, boot Linux and run:"
    echo "    /boot/Gdisk-Installer/encrypted-partition-setup.sh"
    echo ""
    echo "  Press any key to return to the Gdisk menu..."
    read _dummy
    configfile /boot/grub/gdisk-boot.cfg
fi
