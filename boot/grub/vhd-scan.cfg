# ╔════════════════════════════════════════════════════╗
# ║  Gdisk - VHD / VHDX Scanner                        ║
# ║  Auto-scans all partitions for .vhd / .vhdx files  ║
# ║  and routes each hit to /boot/grub/vhd-preboot.cfg ║
# ║                                                    ║
# ║  Scans partition root, /VHD/ and /Gdisk/           ║
# ╚════════════════════════════════════════════════════╝

insmod regexp
insmod probe
insmod read
insmod sleep
insmod part_gpt
insmod part_msdos
insmod fat
insmod ntfs
insmod exfat

# ── Theme / Display ──
if loadfont /boot/grub/font.pf2 ; then
    set gfxmode=auto
    insmod gfxterm
    terminal_output gfxterm
fi
insmod png
if [ -f /boot/grub/theme/grub.png ]; then
    background_image -m stretch /boot/grub/theme/grub.png
fi

set theme=/boot/grub/theme/theme-gdisk.cfg
set timeout=-1
set default=0
set color_normal=white/black
set color_highlight=cyan/black

set vhd_found=0

# ── Scan up to 8 disks, up to 8 partitions each ──
for disk in 0 1 2 3 4 5 6 7; do
    for partnum in 1 2 3 4 5 6 7 8; do
        for partscheme in gpt msdos; do
            set trypart="(hd${disk},${partscheme}${partnum})"

            if [ -d "${trypart}/" ]; then

                for scandir in "" "/VHD" "/Gdisk" "/vhd" "/GDISK"; do
                    for vf in ${trypart}${scandir}/*.vhd ${trypart}${scandir}/*.VHD ${trypart}${scandir}/*.vhdx ${trypart}${scandir}/*.VHDX; do
                        if [ -f "${vf}" ]; then
                            regexp --set=1:vhd_relpath '^\([^)]+\)(.+)$' "${vf}"
                            regexp --set=1:vhd_basename '/([^/]+)$' "${vf}"

                            set vlabel="VHD"
                            if regexp '\.[vV][hH][dD][xX]$' "${vf}"; then
                                set vlabel="VHDX"
                            fi

                            probe --set=vhd_fs -f "${trypart}"
                            if [ -z "${vhd_fs}" ]; then
                                set vhd_fs="?"
                            fi

                            set vhd_found=1

                            menuentry "[${vlabel}] ${vhd_basename}   hd${disk},${partscheme}${partnum} (${vhd_fs})" "hd${disk},${partscheme}${partnum}" "${vhd_relpath}" {
                                set gdisk_dev="${2}"
                                set gdisk_path="${3}"
                                set gdisk_file="(${2})${3}"
                                export gdisk_dev
                                export gdisk_path
                                export gdisk_file
                                configfile /boot/grub/vhd-preboot.cfg
                            }
                        fi
                    done
                done

            fi
        done
    done
done

if [ "${vhd_found}" = "0" ]; then
    menuentry "No .vhd / .vhdx files found" {
        echo ""
        echo "  Place .vhd or .vhdx files in the root, /VHD/ or /Gdisk/"
        echo "  of any attached partition."
        echo ""
        echo "  Reminder: Windows native VHD boot expects an NTFS host"
        echo "  volume, and FAT32 caps single files at 4 GiB."
        echo ""
        echo "  Press any key to return..."
        read
        configfile /boot/grub/vhd-scan.cfg
    }
fi

menuentry "[<-] Back to Main Menu" {
    configfile /boot/grub/gdisk.cfg
}
