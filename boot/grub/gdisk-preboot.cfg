# ╔═════════════════════════════════════════════════════╗
# ║  Gdisk - .gdisk Virtual Disk Pre-Boot Menu          ║
# ║                                                     ║
# ║  Variables expected (exported by caller):           ║
# ║    gdisk_file  = "(hd0,gpt2)/Gdisk/mylinux.gdisk"   ║
# ║    gdisk_path  = "/Gdisk/mylinux.gdisk"             ║
# ║    gdisk_dev   = "hd0,gpt2"                         ║
# ╚═════════════════════════════════════════════════════╝

insmod regexp
insmod loopback
insmod probe
insmod part_gpt
insmod part_msdos
insmod ext2
insmod xfs
insmod btrfs
insmod fat
insmod ntfs
insmod linux

set timeout=-1
set default=0
set color_normal=white/black
set color_highlight=cyan/black

regexp --set=gdisk_name '.*/([^/]+)$' "${gdisk_file}"
if [ -z "${gdisk_name}" ]; then
    set gdisk_name="${gdisk_path}"
fi

probe --set=host_uuid -u "(${gdisk_dev})"

if [ -n "${host_uuid}" ]; then
    set host_dev_param="gdisk.dev=UUID=${host_uuid}"
else
    set host_dev_param="gdisk.dev=/dev/sda1"
fi

# ── Loopback mount ───────────────────────────────────────────
loopback gdloop "${gdisk_file}"

# ════════════════════════════════════════════════════════════
#  PRIMARY: Load the image's own GRUB config
#  This hands off to the .gdisk system's own bootloader,
#  which handles LUKS, custom kernels, recovery, etc.
# ════════════════════════════════════════════════════════════

set gdisk_found_grubcfg=0

for pnum in 1 2 3 4; do
    for pscheme in gpt msdos; do
        set trydev="gdloop,${pscheme}${pnum}"

        if [ -d "(${trydev})/" ]; then
            # Check standard grub.cfg locations
            for gcfg in /boot/grub/grub.cfg /grub/grub.cfg /boot/grub2/grub.cfg /grub2/grub.cfg; do
                if [ -f "(${trydev})${gcfg}" ]; then
                    set gdisk_found_grubcfg=1
                    set gdisk_grubcfg_dev="${trydev}"
                    set gdisk_grubcfg_path="${gcfg}"

                    menuentry "Boot ${gdisk_name} (internal GRUB)" \
                              "${trydev}" "${gcfg}" "${host_dev_param}" "${gdisk_path}" {
                        # Set root to the partition with grub.cfg so
                        # the internal config's relative paths resolve
                        set root="${2}"

                        # Export gdisk params so the internal grub.cfg's
                        # linux lines can be wrapped, or the initramfs
                        # hook picks them up from cmdline
                        set gdisk_extra="${4} gdisk.file=${5}"
                        export gdisk_extra

                        # Load the image's own grub config
                        configfile "(${2})${3}"
                    }
                fi
            done
        fi
    done
done

# ════════════════════════════════════════════════════════════
#  SECONDARY: UEFI map.mod (boots entire image as virtual disk)
# ════════════════════════════════════════════════════════════

if [ "${grub_platform}" = "efi" ]; then
    menuentry "Boot ${gdisk_name} (UEFI disk map)" "${gdisk_file}" {
        loopback -d gdloop
        insmod map
        map -f "${2}"
    }
fi

# ════════════════════════════════════════════════════════════
#  TERTIARY: Direct kernel boot (manual kernel/initrd scan)
# ════════════════════════════════════════════════════════════

submenu "Direct Kernel Boot ->" {

    loopback gdloop "${gdisk_file}"

    set gdisk_found_kernel=0

    for pnum in 1 2 3 4; do
        for pscheme in gpt msdos; do
            set trydev="gdloop,${pscheme}${pnum}"

            if [ -d "(${trydev})/" ]; then

                for kfile in (${trydev})/boot/vmlinuz-*; do
                    if [ -f "${kfile}" ]; then
                        regexp --set=kver '/boot/vmlinuz-(.+)$' "${kfile}"

                        set found_initrd=""
                        if [ -f "(${trydev})/boot/initrd.img-${kver}" ]; then
                            set found_initrd="/boot/initrd.img-${kver}"
                        elif [ -f "(${trydev})/boot/initramfs-${kver}.img" ]; then
                            set found_initrd="/boot/initramfs-${kver}.img"
                        elif [ -f "(${trydev})/boot/initrd-${kver}.img" ]; then
                            set found_initrd="/boot/initrd-${kver}.img"
                        fi

                        if [ -n "${found_initrd}" ]; then
                            set gdisk_found_kernel=1

                            menuentry "Linux ${kver}  [p${pnum}]  -  ${gdisk_name}" \
                                      "${trydev}" "/boot/vmlinuz-${kver}" "${found_initrd}" \
                                      "${host_dev_param}" "${gdisk_path}" "${pnum}" {
                                set gfxpayload=keep
                                linux  "(${2})${3}" root=/dev/gdisk0p${7} ro ${5} gdisk.file=${6} gdisk.root=${7} quiet
                                initrd "(${2})${4}"
                            }
                        fi
                    fi
                done

                for kpath in /boot/vmlinuz /vmlinuz; do
                    if [ -f "(${trydev})${kpath}" ]; then
                        set found_initrd=""
                        if [ -f "(${trydev})/boot/initrd.img" ]; then
                            set found_initrd="/boot/initrd.img"
                        elif [ -f "(${trydev})/boot/initramfs.img" ]; then
                            set found_initrd="/boot/initramfs.img"
                        elif [ -f "(${trydev})/initrd.img" ]; then
                            set found_initrd="/initrd.img"
                        fi

                        if [ -n "${found_initrd}" ]; then
                            set gdisk_found_kernel=1

                            menuentry "Linux (generic)  [p${pnum}]  -  ${gdisk_name}" \
                                      "${trydev}" "${kpath}" "${found_initrd}" \
                                      "${host_dev_param}" "${gdisk_path}" "${pnum}" {
                                set gfxpayload=keep
                                linux  "(${2})${3}" root=/dev/gdisk0p${7} ro ${5} gdisk.file=${6} gdisk.root=${7} quiet
                                initrd "(${2})${4}"
                            }
                        fi
                    fi
                done
            fi
        done
    done

    if [ "${gdisk_found_kernel}" = "0" ]; then
        menuentry "No kernels found inside ${gdisk_name}" {
            echo ""
            echo "  No vmlinuz + initrd pair detected."
            echo "  Press any key..."
            read
        }
    fi

    submenu "Verbose / Debug ->" {
        loopback gdloop "${gdisk_file}"

        for pnum in 1 2 3 4; do
            for pscheme in gpt msdos; do
                set trydev="gdloop,${pscheme}${pnum}"
                if [ -d "(${trydev})/" ]; then
                    for kfile in (${trydev})/boot/vmlinuz-*; do
                        if [ -f "${kfile}" ]; then
                            regexp --set=kver '/boot/vmlinuz-(.+)$' "${kfile}"
                            set found_initrd=""
                            if [ -f "(${trydev})/boot/initrd.img-${kver}" ]; then
                                set found_initrd="/boot/initrd.img-${kver}"
                            elif [ -f "(${trydev})/boot/initramfs-${kver}.img" ]; then
                                set found_initrd="/boot/initramfs-${kver}.img"
                            fi
                            if [ -n "${found_initrd}" ]; then
                                menuentry "Verbose: Linux ${kver} [p${pnum}]" \
                                          "${trydev}" "/boot/vmlinuz-${kver}" "${found_initrd}" \
                                          "${host_dev_param}" "${gdisk_path}" "${pnum}" {
                                    set gfxpayload=keep
                                    linux  "(${2})${3}" root=/dev/gdisk0p${7} rw ${5} gdisk.file=${6} gdisk.root=${7}
                                    initrd "(${2})${4}"
                                }
                            fi
                        fi
                    done
                fi
            done
        done

        menuentry "[<-] Back" {
            loopback -d gdloop
            configfile /boot/grub/gdisk-preboot.cfg
        }
    }

}

# ── VdiskChain fallback ──────────────────────────────────────
if [ -f /boot/grub/vdiskchain/vdiskchain ] && [ "${grub_platform}" = "efi" ]; then
    menuentry "VdiskChain (Ventoy compat)" "${gdisk_path}" {
        loopback -d gdloop
        insmod chain
        chainloader /boot/grub/vdiskchain/vdiskchain vdisk=${2}
        boot
    }
fi

menuentry "[<-] Back" {
    configfile /boot/grub/gdisk-preboot.cfg
}