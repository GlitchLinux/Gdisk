# ╔═════════════════════════════════════════════════════╗
# ║  Gdisk - .gdisk Virtual Disk Pre-Boot Menu          ║
# ║                                                     ║
# ║  Variables expected (exported by caller):           ║
# ║    gdisk_file  = "(hd0,gpt2)/Gdisk/mylinux.gdisk"   ║
# ║    gdisk_path  = "/Gdisk/mylinux.gdisk"             ║
# ║    gdisk_dev   = "hd0,gpt2"                         ║
# ╚═════════════════════════════════════════════════════╝

insmod regexp
insmod loopback
insmod probe
insmod part_gpt
insmod part_msdos
insmod ext2
insmod xfs
insmod btrfs
insmod fat
insmod ntfs
insmod linux

set timeout=3
set default=0
set color_normal=white/black
set color_highlight=cyan/black

regexp --set=gdisk_name '.*/([^/]+)$' "${gdisk_file}"
if [ -z "${gdisk_name}" ]; then
    set gdisk_name="${gdisk_path}"
fi

probe --set=host_uuid -u "(${gdisk_dev})"

# ── Encrypted host detection ─────────────────────────────────
# When the .gdisk lives on a GRUB-unlocked LUKS volume (crypto0..3),
# the booted guest cannot see the inner filesystem until it unlocks
# the container itself. Flag it (gdisk.luks=1) and pass the LUKS
# container UUID set earlier by gdisk-crypto.cfg so the guest
# initramfs can cryptsetup-open the right container before locating
# the .gdisk file. probe -u on (crypto0) already yields the INNER
# filesystem UUID, so gdisk.dev still points the guest at the
# volume it will see once the container is open.
set gdisk_luks_param=""
if regexp '^crypto[0-9]' "${gdisk_dev}"; then
    set gdisk_luks_param=" gdisk.luks=1"
    if [ -n "${crypto_uuid}" ]; then
        set gdisk_luks_param="${gdisk_luks_param} gdisk.luksuuid=${crypto_uuid}"
    fi
fi

if [ -n "${host_uuid}" ]; then
    set host_dev_param="gdisk.dev=UUID=${host_uuid}${gdisk_luks_param}"
elif [ -n "${gdisk_luks_param}" ]; then
    # Encrypted host but inner UUID unreadable: let the guest fall
    # back to the decrypted mapper after it unlocks the container.
    set host_dev_param="gdisk.dev=UUID=gdisk-luks-host${gdisk_luks_param}"
else
    set host_dev_param="gdisk.dev=/dev/sda1"
fi

# ── Keyfile injection for single-passphrase boot ─────────────
# If the encrypted volume carries an unlock keyfile at
# /gdisk-keys/host.key, hand it to the guest initramfs as an extra
# in-memory initrd segment (GRUB 'newc:'). The guest then opens the
# host LUKS container with that key instead of asking the user for
# the passphrase a SECOND time. The keyfile lives INSIDE the
# encrypted volume, so it is never stored in plaintext at rest, and
# if it is absent the guest simply falls back to a passphrase prompt.
set gdisk_key_newc=""
if [ -n "${gdisk_luks_param}" ]; then
    if [ -f "(${gdisk_dev})/gdisk-keys/host.key" ]; then
        set gdisk_key_newc="newc:gdisk-host.key:(${gdisk_dev})/gdisk-keys/host.key"
    fi
fi

loopback gdloop "${gdisk_file}"

set gdisk_found_kernel=0

for pnum in 1 2 3 4; do
    for pscheme in gpt msdos; do
        set trydev="gdloop,${pscheme}${pnum}"

        if [ -d "(${trydev})/" ]; then

            # ── /boot/vmlinuz-* (standard layout) ────────
            for kfile in (${trydev})/boot/vmlinuz-*; do
                if [ -f "${kfile}" ]; then
                    regexp --set=kver '/boot/vmlinuz-(.+)$' "${kfile}"

                    set found_initrd=""
                    if [ -f "(${trydev})/boot/initrd.img-${kver}" ]; then
                        set found_initrd="/boot/initrd.img-${kver}"
                    elif [ -f "(${trydev})/boot/initramfs-${kver}.img" ]; then
                        set found_initrd="/boot/initramfs-${kver}.img"
                    elif [ -f "(${trydev})/boot/initrd-${kver}.img" ]; then
                        set found_initrd="/boot/initrd-${kver}.img"
                    fi

                    if [ -n "${found_initrd}" ]; then
                        set gdisk_found_kernel=1

                        menuentry "Linux ${kver}  [p${pnum}]  -  ${gdisk_name}" \
                                  "${trydev}" "/boot/vmlinuz-${kver}" "${found_initrd}" \
                                  "${host_dev_param}" "${gdisk_path}" "${pnum}" "${gdisk_key_newc}" {
                            set gfxpayload=keep
                            linux  "(${2})${3}" root=/dev/gdisk0p${7} ro ${5} gdisk.file=${6} gdisk.root=${7} quiet
                            if [ -n "${8}" ]; then
                                initrd "(${2})${4}" "${8}"
                            else
                                initrd "(${2})${4}"
                            fi
                        }
                    fi
                fi
            done

            # ── /vmlinuz-* (separate /boot partition) ────
            for kfile in (${trydev})/vmlinuz-*; do
                if [ -f "${kfile}" ]; then
                    regexp --set=kver '/vmlinuz-(.+)$' "${kfile}"

                    set found_initrd=""
                    if [ -f "(${trydev})/initrd.img-${kver}" ]; then
                        set found_initrd="/initrd.img-${kver}"
                    elif [ -f "(${trydev})/initramfs-${kver}.img" ]; then
                        set found_initrd="/initramfs-${kver}.img"
                    elif [ -f "(${trydev})/initrd-${kver}.img" ]; then
                        set found_initrd="/initrd-${kver}.img"
                    fi

                    if [ -n "${found_initrd}" ]; then
                        set gdisk_found_kernel=1

                        menuentry "Linux ${kver}  [boot:p${pnum}]  -  ${gdisk_name}" \
                                  "${trydev}" "/vmlinuz-${kver}" "${found_initrd}" \
                                  "${host_dev_param}" "${gdisk_path}" "${pnum}" "${gdisk_key_newc}" {
                            set gfxpayload=keep
                            linux  "(${2})${3}" root=/dev/gdisk0p${7} ro ${5} gdisk.file=${6} gdisk.root=${7} quiet
                            if [ -n "${8}" ]; then
                                initrd "(${2})${4}" "${8}"
                            else
                                initrd "(${2})${4}"
                            fi
                        }
                    fi
                fi
            done

            # ── /boot/vmlinuz or /vmlinuz (unversioned) ──
            for kpath in /boot/vmlinuz /vmlinuz; do
                if [ -f "(${trydev})${kpath}" ]; then
                    set found_initrd=""
                    if [ -f "(${trydev})/boot/initrd.img" ]; then
                        set found_initrd="/boot/initrd.img"
                    elif [ -f "(${trydev})/boot/initramfs.img" ]; then
                        set found_initrd="/boot/initramfs.img"
                    elif [ -f "(${trydev})/initrd.img" ]; then
                        set found_initrd="/initrd.img"
                    elif [ -f "(${trydev})/initramfs.img" ]; then
                        set found_initrd="/initramfs.img"
                    fi

                    if [ -n "${found_initrd}" ]; then
                        set gdisk_found_kernel=1

                        menuentry "Linux (generic)  [p${pnum}]  -  ${gdisk_name}" \
                                  "${trydev}" "${kpath}" "${found_initrd}" \
                                  "${host_dev_param}" "${gdisk_path}" "${pnum}" "${gdisk_key_newc}" {
                            set gfxpayload=keep
                            linux  "(${2})${3}" root=/dev/gdisk0p${7} ro ${5} gdisk.file=${6} gdisk.root=${7} quiet
                            if [ -n "${8}" ]; then
                                initrd "(${2})${4}" "${8}"
                            else
                                initrd "(${2})${4}"
                            fi
                        }
                    fi
                fi
            done
        fi
    done
done

if [ "${gdisk_found_kernel}" = "0" ]; then
    set timeout=-1

    if [ "${grub_platform}" = "efi" ]; then
        menuentry "Boot ${gdisk_name} (UEFI disk map)" "${gdisk_file}" {
            loopback -d gdloop
            insmod map
            map -f "${2}"
        }
    fi

    menuentry "No kernels found inside ${gdisk_name}" {
        echo ""
        echo "  No vmlinuz + initrd pair detected."
        echo "  Scanned: /boot/vmlinuz-* and /vmlinuz-*"
        echo "  on partitions 1-4 (gpt and msdos)"
        echo ""
        echo "  Press any key..."
        read
    }
fi

menuentry "[<-] Back" {
    configfile /boot/grub/gdisk.cfg
}
