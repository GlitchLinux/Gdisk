if [ "${grub_platform}" == "efi" ]; then
    set gfxmode=800x600
    terminal_output console
else
    set gfxmode=800x600
    terminal_output console
fi

set default=0
set timeout=5

if [ "${grub_platform}" == "efi" ]; then
menuentry "Gdisk Installer v3.2" {
	linux /boot/grub/gdisk-installer/bzImage console=ttyS0,115200 console=tty0 quiet loglevel=3
	initrd /boot/grub/gdisk-installer/rootfs.cpio.xz
}
menuentry "Gdisk Installer iPXE" {
	insmod part_msdos
	insmod fat
	insmod chain
	chainloader /boot/grub/gdisk-installer/iPXE/Gdisk-Installer-v2.3.efi
}
else
    menuentry "Gdisk Installer v3.2" {
        terminal_output console
	linux /boot/grub/gdisk-installer/bzImage console=ttyS0,115200 console=tty0 quiet loglevel=3
	initrd /boot/grub/gdisk-installer/rootfs.cpio.xz
    }
    menuentry "Gdisk Installer iPXE" {
	insmod syslinuxcfg
	syslinux_configfile /boot/grub/gdisk-installer/isolinux.cfg
    }
fi
